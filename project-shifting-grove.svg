<svg xmlns="http://www.w3.org/2000/svg" width="920" height="270" viewBox="0 0 920 270" role="img" aria-labelledby="title desc">
  <title id="title">The Shifting Grove</title>
  <desc id="desc">Project card for a Python and Pygame game featuring procedural generation, BFS pathfinding, finite state machines, game AI, and modular state architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090D19"/><stop offset="1" stop-color="#0E1426"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9" stop-opacity="0.30"/><stop offset="0.44" stop-color="#A78BFA" stop-opacity="0.58"/><stop offset="1" stop-color="#F3A6C8" stop-opacity="0.48"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#AAB2C8" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect x="1" y="1" width="918" height="268" rx="26" fill="url(#bg)" stroke="url(#frame)"/>
  <rect x="12" y="12" width="896" height="246" rx="19" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="44" fill="#9BEAF5" font-size="10.5" font-weight="700" letter-spacing="2.3">03 / SOFTWARE + ALGORITHMIC SYSTEMS</text>
    <text x="42" y="82" fill="#F8FAFC" font-size="27" font-weight="760" letter-spacing="-0.5">The Shifting Grove</text>
    <text x="42" y="112" fill="#AAB2C8" font-size="13.2" font-weight="500">Python/Pygame game built around procedural maze generation, BFS-validated routes,</text>
    <text x="42" y="132" fill="#AAB2C8" font-size="13.2" font-weight="500">finite-state-machine AI, mini-games, collision systems, and modular state architecture.</text>

    <text x="42" y="167" fill="#76809A" font-size="9.8" font-weight="700" letter-spacing="1.8">CORE STACK</text>
    <g transform="translate(42 180)" font-size="11" font-weight="650">
      <rect width="76" height="28" rx="9" fill="#F3A6C8" fill-opacity="0.08" stroke="#F3A6C8" stroke-opacity="0.23"/><text x="15" y="18" fill="#F3A6C8">Python</text>
      <g transform="translate(86 0)"><rect width="82" height="28" rx="9" fill="#A78BFA" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.22"/><text x="14" y="18" fill="#C4B5FD">Pygame</text></g>
      <g transform="translate(178 0)"><rect width="118" height="28" rx="9" fill="#67E8F9" fill-opacity="0.05" stroke="#67E8F9" stroke-opacity="0.18"/><text x="14" y="18" fill="#9BEAF5">BFS Pathfinding</text></g>
      <g transform="translate(306 0)"><rect width="72" height="28" rx="9" fill="#A78BFA" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.22"/><text x="16" y="18" fill="#C4B5FD">FSM</text></g>
      <g transform="translate(388 0)"><rect width="141" height="28" rx="9" fill="#F3A6C8" fill-opacity="0.06" stroke="#F3A6C8" stroke-opacity="0.18"/><text x="14" y="18" fill="#F0B3D0">Procedural Gen.</text></g>
    </g>
    <text x="42" y="239" fill="#C4B5FD" font-size="10.5" font-weight="700" letter-spacing="1.2">GENERATE → VALIDATE → SEARCH → ADAPT → TRANSITION</text>
  </g>

  <!-- BFS / maze motif -->
  <g transform="translate(665 36)">
    <rect width="210" height="194" rx="20" fill="#12182B" fill-opacity="0.70" stroke="#C4B5FD" stroke-opacity="0.12"/>
    <text x="20" y="29" fill="#76809A" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1.7">PATHFINDING TRACE</text>
    <g stroke="#AAB2C8" stroke-opacity="0.12" stroke-width="1">
      <path d="M25 52H185M25 84H185M25 116H185M25 148H185"/>
      <path d="M25 52V180M57 52V180M89 52V180M121 52V180M153 52V180M185 52V180"/>
    </g>
    <path d="M41 164V132H73V100H105V68H137V100H169V68" fill="none" stroke="#A78BFA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0D1224" stroke-width="2">
      <circle cx="41" cy="164" r="6" stroke="#F3A6C8"/>
      <circle cx="73" cy="132" r="5" stroke="#C4B5FD"/>
      <circle cx="105" cy="100" r="5" stroke="#C4B5FD"/>
      <circle cx="137" cy="68" r="5" stroke="#A78BFA"/>
      <circle cx="169" cy="68" r="6" stroke="#67E8F9"/>
    </g>
    <circle cx="41" cy="164" r="2" fill="#F3A6C8"/>
    <circle cx="169" cy="68" r="2" fill="#67E8F9"/>
  </g>
</svg>
