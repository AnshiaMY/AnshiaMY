<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Activity</title>
  <desc id="desc">Profile activity panel. Run the included GitHub Action once to populate current contribution metrics automatically.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090D19"/><stop offset="1" stop-color="#0E1426"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F3A6C8" stop-opacity="0.46"/><stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.46"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0.18"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#AAB2C8" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect x="1" y="1" width="918" height="328" rx="28" fill="url(#bg)" stroke="url(#frame)"/>
  <rect x="12" y="12" width="896" height="304" rx="20" fill="url(#grid)"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="44" fill="#C4B5FD" font-size="10.5" font-weight="700" letter-spacing="2.4">GITHUB ACTIVITY / AUTO-REFRESH</text>
    <text x="42" y="75" fill="#F8FAFC" font-size="21" font-weight="740">Live profile metrics, generated inside this repository.</text>
    <text x="42" y="98" fill="#76809A" font-size="11.5">Run “Update profile activity” once after pushing these files; this panel will populate automatically.</text>

    <g transform="translate(42 128)">
      <rect width="192" height="72" rx="16" fill="#12182B" stroke="#F3A6C8" stroke-opacity="0.16"/>
      <text x="18" y="27" fill="#76809A" font-size="9" font-weight="700" letter-spacing="1.4">12-MO CONTRIBUTIONS</text>
      <text x="18" y="55" fill="#F3A6C8" font-size="22" font-weight="760">—</text>
    </g>
    <g transform="translate(250 128)">
      <rect width="192" height="72" rx="16" fill="#12182B" stroke="#A78BFA" stroke-opacity="0.16"/>
      <text x="18" y="27" fill="#76809A" font-size="9" font-weight="700" letter-spacing="1.4">COMMITS</text>
      <text x="18" y="55" fill="#C4B5FD" font-size="22" font-weight="760">—</text>
    </g>
    <g transform="translate(458 128)">
      <rect width="192" height="72" rx="16" fill="#12182B" stroke="#A78BFA" stroke-opacity="0.16"/>
      <text x="18" y="27" fill="#76809A" font-size="9" font-weight="700" letter-spacing="1.4">PUBLIC REPOS</text>
      <text x="18" y="55" fill="#C4B5FD" font-size="22" font-weight="760">3</text>
    </g>
    <g transform="translate(666 128)">
      <rect width="212" height="72" rx="16" fill="#12182B" stroke="#67E8F9" stroke-opacity="0.14"/>
      <text x="18" y="27" fill="#76809A" font-size="9" font-weight="700" letter-spacing="1.4">STARS ACROSS REPOS</text>
      <text x="18" y="55" fill="#9BEAF5" font-size="22" font-weight="760">—</text>
    </g>

    <text x="42" y="230" fill="#76809A" font-size="9" font-weight="700" letter-spacing="1.4">RECENT CONTRIBUTION SIGNAL</text>
    <g transform="translate(42 246)">
      <rect width="836" height="42" rx="14" fill="#12182B" fill-opacity="0.72" stroke="#C4B5FD" stroke-opacity="0.10"/>
      <text x="18" y="26" fill="#AAB2C8" font-size="11">Waiting for first workflow refresh → .github/workflows/update-profile-activity.yml</text>
    </g>
  </g>
</svg>
