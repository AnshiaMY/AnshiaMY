<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Anshia Muhammad Yaqoob — Mechatronics Engineering</title>
  <desc id="desc">A dark navy engineering profile banner with blush and violet accents, subtle circuit traces, and a systems diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#0D1224"/>
      <stop offset="1" stop-color="#11172A"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3A6C8" stop-opacity="0.75"/>
      <stop offset="0.48" stop-color="#A78BFA" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3A6C8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#E879B9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E879B9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#AAB2C8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="918" height="298" rx="28" fill="url(#bg)" stroke="url(#frame)" stroke-width="1.5"/>
  <rect x="14" y="14" width="892" height="272" rx="21" fill="url(#grid)" stroke="#FFFFFF" stroke-opacity="0.04"/>
  <circle cx="170" cy="20" r="180" fill="url(#glowPink)" filter="url(#softGlow)"/>
  <circle cx="820" cy="280" r="210" fill="url(#glowViolet)" filter="url(#softGlow)"/>

  <!-- Left identity block -->
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="58" y="58" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="2.6">ENGINEERING PROFILE / 2026</text>
    <rect x="58" y="73" width="84" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="58" y="132" fill="#F8FAFC" font-size="43" font-weight="760" letter-spacing="-1.4">ANSHIA MUHAMMAD</text>
    <text x="58" y="178" fill="#F8FAFC" font-size="43" font-weight="760" letter-spacing="-1.4">YAQOOB</text>

    <text x="60" y="215" fill="#F3A6C8" font-size="16" font-weight="700" letter-spacing="1.8">MECHATRONICS ENGINEERING</text>
    <text x="60" y="246" fill="#AAB2C8" font-size="14.5" font-weight="520">Robotics  •  Embedded Systems  •  Automation  •  Software</text>
    <text x="60" y="271" fill="#76809A" font-size="11.5" font-weight="540" letter-spacing="0.8">BUILDING SYSTEMS ACROSS SOFTWARE, ELECTRONICS &amp; CONTROL</text>
  </g>

  <!-- Divider -->
  <path d="M618 44V256" stroke="#C4B5FD" stroke-opacity="0.16"/>
  <circle cx="618" cy="80" r="2.5" fill="#F3A6C8"/>
  <circle cx="618" cy="220" r="2.5" fill="#67E8F9"/>

  <!-- Systems map -->
  <g transform="translate(650 45)" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="14" fill="#76809A" font-size="10" font-weight="700" letter-spacing="2">SYSTEM MAP</text>
    <path d="M34 44 C92 44, 78 83, 132 83 S166 123, 220 123 S208 167, 252 167" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.72"/>
    <path d="M34 44 C92 44, 78 83, 132 83 S166 123, 220 123 S208 167, 252 167" fill="none" stroke="#A78BFA" stroke-width="8" stroke-opacity="0.08" filter="url(#softGlow)"/>

    <g>
      <circle cx="34" cy="44" r="8" fill="#0D1224" stroke="#F3A6C8" stroke-width="2"/>
      <circle cx="132" cy="83" r="8" fill="#0D1224" stroke="#C4B5FD" stroke-width="2"/>
      <circle cx="220" cy="123" r="8" fill="#0D1224" stroke="#A78BFA" stroke-width="2"/>
      <circle cx="252" cy="167" r="8" fill="#0D1224" stroke="#67E8F9" stroke-width="2"/>
    </g>

    <text x="52" y="48" fill="#F8FAFC" font-size="12" font-weight="700">SENSE</text>
    <text x="150" y="87" fill="#F8FAFC" font-size="12" font-weight="700">COMPUTE</text>
    <text x="205" y="127" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="end">CONTROL</text>
    <text x="198" y="171" fill="#F8FAFC" font-size="12" font-weight="700">ACT</text>

    <rect x="0" y="205" width="220" height="38" rx="12" fill="#12182B" fill-opacity="0.82" stroke="#C4B5FD" stroke-opacity="0.16"/>
    <circle cx="20" cy="224" r="4" fill="#F3A6C8"/>
    <text x="34" y="228" fill="#C4B5FD" font-size="10.5" font-weight="700" letter-spacing="1.4">PHYSICAL SYSTEM / OUTPUT</text>
  </g>
</svg>
