<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Toolkit</title>
  <desc id="desc">A compact engineering toolkit grouped into languages, robotics and embedded systems, engineering and design, software and development, and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090D19"/><stop offset="1" stop-color="#0E1426"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F3A6C8" stop-opacity="0.48"/><stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.44"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0.18"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#AAB2C8" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect x="1" y="1" width="918" height="518" rx="28" fill="url(#bg)" stroke="url(#frame)"/>
  <rect x="12" y="12" width="896" height="496" rx="20" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="46" fill="#C4B5FD" font-size="10.5" font-weight="700" letter-spacing="2.4">ENGINEERING TOOLKIT</text>
    <text x="42" y="75" fill="#F8FAFC" font-size="21" font-weight="740">Tools selected by function, not badge count.</text>
    <text x="42" y="97" fill="#76809A" font-size="11.5" font-weight="500">A concise view of the technologies and engineering methods used across current work.</text>

    <!-- Languages -->
    <g transform="translate(42 124)">
      <rect width="404" height="108" rx="18" fill="#12182B" fill-opacity="0.78" stroke="#F3A6C8" stroke-opacity="0.18"/>
      <circle cx="28" cy="28" r="5" fill="#F3A6C8"/><text x="44" y="32" fill="#F8FAFC" font-size="13" font-weight="700">Languages</text>
      <text x="20" y="68" fill="#F3A6C8" font-size="12" font-weight="650">Python</text>
      <text x="92" y="68" fill="#C4B5FD" font-size="12" font-weight="650">C++</text>
      <text x="139" y="68" fill="#9BEAF5" font-size="12" font-weight="650">C</text>
      <path d="M20 86H382" stroke="#AAB2C8" stroke-opacity="0.08"/>
      <text x="20" y="98" fill="#76809A" font-size="8.8" font-weight="700" letter-spacing="1.3">SOFTWARE + CONTROL LOGIC</text>
    </g>

    <!-- Robotics -->
    <g transform="translate(474 124)">
      <rect width="404" height="108" rx="18" fill="#12182B" fill-opacity="0.78" stroke="#A78BFA" stroke-opacity="0.18"/>
      <circle cx="28" cy="28" r="5" fill="#A78BFA"/><text x="44" y="32" fill="#F8FAFC" font-size="13" font-weight="700">Robotics &amp; Embedded</text>
      <text x="20" y="66" fill="#C4B5FD" font-size="11.5" font-weight="650">Raspberry Pi</text>
      <text x="113" y="66" fill="#C4B5FD" font-size="11.5" font-weight="650">Sensors</text>
      <text x="179" y="66" fill="#C4B5FD" font-size="11.5" font-weight="650">PID Control</text>
      <text x="268" y="66" fill="#C4B5FD" font-size="11.5" font-weight="650">VEX Robotics</text>
      <path d="M20 86H382" stroke="#AAB2C8" stroke-opacity="0.08"/>
      <text x="20" y="98" fill="#76809A" font-size="8.8" font-weight="700" letter-spacing="1.3">SENSING + ACTUATION + INTEGRATION</text>
    </g>

    <!-- Engineering -->
    <g transform="translate(42 248)">
      <rect width="404" height="108" rx="18" fill="#12182B" fill-opacity="0.78" stroke="#A78BFA" stroke-opacity="0.18"/>
      <circle cx="28" cy="28" r="5" fill="#C4B5FD"/><text x="44" y="32" fill="#F8FAFC" font-size="13" font-weight="700">Engineering &amp; Design</text>
      <text x="20" y="66" fill="#C4B5FD" font-size="11.5" font-weight="650">SolidWorks</text>
      <text x="105" y="66" fill="#C4B5FD" font-size="11.5" font-weight="650">AutoCAD</text>
      <text x="178" y="66" fill="#C4B5FD" font-size="11.5" font-weight="650">Electrical Drawings</text>
      <text x="302" y="66" fill="#C4B5FD" font-size="11.5" font-weight="650">Mechanical</text>
      <path d="M20 86H382" stroke="#AAB2C8" stroke-opacity="0.08"/>
      <text x="20" y="98" fill="#76809A" font-size="8.8" font-weight="700" letter-spacing="1.3">CAD + LAYOUT + SYSTEM DOCUMENTATION</text>
    </g>

    <!-- Software -->
    <g transform="translate(474 248)">
      <rect width="404" height="108" rx="18" fill="#12182B" fill-opacity="0.78" stroke="#67E8F9" stroke-opacity="0.15"/>
      <circle cx="28" cy="28" r="5" fill="#67E8F9"/><text x="44" y="32" fill="#F8FAFC" font-size="13" font-weight="700">Software &amp; Development</text>
      <text x="20" y="66" fill="#9BEAF5" font-size="11.5" font-weight="650">Git</text>
      <text x="53" y="66" fill="#9BEAF5" font-size="11.5" font-weight="650">GitHub</text>
      <text x="112" y="66" fill="#9BEAF5" font-size="11.5" font-weight="650">Pygame</text>
      <text x="180" y="66" fill="#9BEAF5" font-size="11.5" font-weight="650">OOP</text>
      <text x="221" y="66" fill="#9BEAF5" font-size="11.5" font-weight="650">Debugging</text>
      <path d="M20 86H382" stroke="#AAB2C8" stroke-opacity="0.08"/>
      <text x="20" y="98" fill="#76809A" font-size="8.8" font-weight="700" letter-spacing="1.3">ARCHITECTURE + VERSION CONTROL + TESTING</text>
    </g>

    <!-- Automation -->
    <g transform="translate(42 372)">
      <rect width="836" height="104" rx="18" fill="#12182B" fill-opacity="0.78" stroke="#F3A6C8" stroke-opacity="0.16"/>
      <circle cx="28" cy="28" r="5" fill="#F3A6C8"/><text x="44" y="32" fill="#F8FAFC" font-size="13" font-weight="700">Industrial Automation</text>
      <g font-size="11.5" font-weight="650">
        <text x="20" y="66" fill="#F0B3D0">PLCs</text>
        <text x="75" y="66" fill="#F0B3D0">HMIs</text>
        <text x="128" y="66" fill="#F0B3D0">Remote I/O</text>
        <text x="226" y="66" fill="#F0B3D0">Industrial Networking</text>
        <text x="375" y="66" fill="#F0B3D0">System Layouts</text>
        <text x="492" y="66" fill="#F0B3D0">Troubleshooting</text>
      </g>
      <path d="M20 84H814" stroke="#AAB2C8" stroke-opacity="0.08"/>
      <text x="20" y="96" fill="#76809A" font-size="8.8" font-weight="700" letter-spacing="1.3">CONTROL HARDWARE + COMMUNICATION + TECHNICAL SUPPORT</text>
    </g>
  </g>
</svg>
