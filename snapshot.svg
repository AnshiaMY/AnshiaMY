<svg xmlns="http://www.w3.org/2000/svg" width="920" height="226" viewBox="0 0 920 226" role="img" aria-labelledby="title desc">
  <title id="title">At a glance</title>
  <desc id="desc">Four concise profile facts covering Waterloo Mechatronics Engineering, integrated systems work, industrial automation experience, and a direction toward AI and intelligent systems.</desc>
  <defs>
