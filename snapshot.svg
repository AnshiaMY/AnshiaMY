    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F3A6C8" stop-opacity="0.55"/><stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.46"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0.18"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F3A6C8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#AAB2C8" stroke-opacity="0.04"/></pattern>
